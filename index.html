<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Papers Scissors! The Odin Project</title>
  <!-- STYLES -->
  <!-- Icons: Favicon -->
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
</head>

<body>
  <main class="container">
    <h1 class="container__title">Rock Papers Scissors!</h1>
    <p class="container__desc">What is your choice, Player?</p>

    <div class="options-container">
      <div class="rock-button">
        <img src="./img/landslide-icon.svg" alt="SVG mountain icon. It is not a rock, actually"
          class="rock-button__image">
        <p class="rock-button__text">ROCK</p>
      </div>
      <div class="paper-button">
        <img src="./img/text-file-icon.svg" alt="SVG text file icon, but should be a paper actually"
          class="paper-button__image">
        <p class="paper-button__text">PAPER</p>
      </div>
      <div class="scissor-button">
        <img src="./img/cut-scissor-icon.svg" alt="SVG cut scissor icon and actually it is"
          class="scissor-button__image">
        <p class="scissor-button__text">SCISSOR</p>
      </div>
    </div>

    <hr>

    <div class="result-message">Waiting...</div>
  </main> <!-- SCRIPT -->
  <script src="./js/script.js"></script>
</body>

</html>
